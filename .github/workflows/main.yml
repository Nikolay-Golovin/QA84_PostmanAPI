name: Automated API tests using Postman CLI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  automated-api-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install and Run Postman Tests
        run: |
          curl -o- "https://config-cli.postman.com/scripts/install/install-linux.sh" | bash
          export PATH="$HOME/.postman:/usr/local/bin:$PATH"
          postman login --with-api-key ${{ secrets.POSTMAN_API_KEY }}
          postman collection run 57903648-bf2762de-bab4-4bc2-8e10-8d72c1874ff7 -e 57903648-2d2114a3-22d6-48dd-981b-933e2f582eb6
