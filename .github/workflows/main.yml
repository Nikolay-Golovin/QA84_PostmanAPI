name: Automated API tests using Newman

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  automated-api-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18

      - name: Run Newman Tests
        run: |
          npx newman run "https://api.postman.com/collections/57903648-bf2762de-bab4-4bc2-8e10-8d72c1874ff7?apikey=${{ secrets.POSTMAN_API_KEY }}" -e "https://api.postman.com/environments/57903648-2d2114a3-22d6-48dd-981b-933e2f582eb6?apikey=${{ secrets.POSTMAN_API_KEY }}"
